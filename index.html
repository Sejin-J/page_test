<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>High-Fidelity 3-DOF Aero Simulator</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; background: #1a1a1a; color: #eee; }
        #sidebar { width: 380px; padding: 20px; overflow-y: auto; background: #252525; border-right: 1px solid #333; }
        #main { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #2d2d2d; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        label { font-size: 11px; color: #aaa; text-transform: uppercase; }
        input { background: #3d3d3d; border: 1px solid #555; color: #fff; padding: 4px; border-radius: 4px; width: 100%; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .header { border-bottom: 1px solid #444; margin-bottom: 15px; padding-bottom: 5px; color: #00d4ff; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2 style="margin-top:0">Aero Config</h2>
    
    <div class="header">Physical & Geometry</div>
    <div class="input-grid">
        <label>Mass (kg)<input type="number" id="mass" value="2.5"></label>
        <label>Iyy (kg·m²)<input type="number" id="iyy" value="0.15"></label>
        <label>S (m²)<input type="number" id="area" value="0.45"></label>
        <label>c (chord, m)<input type="number" id="chord" value="0.25"></label>
    </div>

    <div class="header">Lift & Drag Coefficients</div>
    <div class="input-grid">
        <label>CL_0<input type="number" id="cl0" value="0.25"></label>
        <label>CL_alpha (/rad)<input type="number" id="cla" value="4.8"></label>
        <label>CD_0 (Parasitic)<input type="number" id="cd0" value="0.025"></label>
        <label>K (Induced Drag)<input type="number" id="k_drag" value="0.05"></label>
    </div>

    <div class="header">Pitching Moment Derivatives</div>
    <div class="input-grid">
        <label>Cm_0<input type="number" id="cm0" value="0.02"></label>
        <label>Cm_alpha (Stability)<input type="number" id="cma" value="-0.8"></label>
        <label>Cm_q (Damping)<input type="number" id="cmq" value="-12.0"></label>
        <label>Cm_delta_e (Effect)<input type="number" id="cmde" value="-1.1"></label>
    </div>

    <div class="header">Control & Command</div>
    <select id="mode" style="width:100%; margin-bottom:10px; background: #3d3d3d; color: #fff;">
        <option value="pitch">Pitch Angle Control</option>
        <option value="alt">Altitude Hold</option>
    </select>
    <label>Target Value<input type="number" id="target" value="5"></label>
    
    <div class="header">PID Gains</div>
    <div class="input-grid">
        <label>Kp<input type="number" id="kp" value="1.2"></label>
        <label>Ki<input type="number" id="ki" value="0.1"></label>
        <label>Kd<input type="number" id="kd" value="0.3"></label>
    </div>

    <button onclick="toggleSim()" id="btn">START SIMULATION</button>
</div>

<div id="main">
    <div class="card" id="statePlot" style="flex:1"></div>
    <div class="card" id="aeroPolarPlot" style="flex:1"></div>
    <div class="card" id="vizPlot" style="height:250px"></div>
</div>

<script>
let running = false;
const dt = 0.01;
let time = 0;

// States: [V, alpha, q, theta, x, z]
let s = { V: 15, a: 0, q: 0, th: 0, x: 0, z: 50 };
let hist = { t:[], z:[], th:[], target:[] };
let errInt = 0;

function getAero(alpha, q, de) {
    const p = {
        cl0: +cl0.value, cla: +cla.value, cd0: +cd0.value, k: +k_drag.value,
        cm0: +cm0.value, cma: +cma.value, cmq: +cmq.value, cmde: +cmde.value,
        S: +area.value, c: +chord.value, mass: +mass.value, iyy: +iyy.value
    };

    const q_inf = 0.5 * 1.225 * s.V**2;
    const CL = p.cl0 + p.cla * alpha;
    const CD = p.cd0 + p.k * CL**2;
    // Cm 계산 (Non-dimensional damping cmq * q * c / (2V) 포함)
    const Cm = p.cm0 + p.cma * alpha + p.cmq * (q * p.c / (2 * s.V)) + p.cmde * de;

    return { 
        L: CL * q_inf * p.S, 
        D: CD * q_inf * p.S, 
        M: Cm * q_inf * p.S * p.c,
        p: p 
    };
}

function physicsStep() {
    // 1. Controller (PID)
    const targetVal = +target.value;
    const isAltMode = mode.value === 'alt';
    
    let cmdTheta = isAltMode ? (targetVal - s.z) * 0.1 : targetVal * Math.PI/180;
    cmdTheta = Math.max(-0.3, Math.min(0.3, cmdTheta));

    const err = cmdTheta - s.th;
    errInt += err * dt;
    const de = (+kp.value * err) + (+ki.value * errInt) - (+kd.value * s.q);

    // 2. Aero Forces
    const aero = getAero(s.a, s.q, de);
    const g = 9.81;

    // 3. EOM (Body Frame simplified longitudinal)
    // T(Thrust)는 속도 유지를 위해 Drag와 평형이라고 가정 (Trimmed)
    const dV = 0; // Constant speed assumption for clarity, or add Thrust logic
    const da = s.q - (aero.L - aero.p.mass * g * Math.cos(s.th - s.a)) / (aero.p.mass * s.V);
    const dq = aero.M / aero.p.iyy;
    const dth = s.q;

    // 4. Integration
    s.a += da * dt;
    s.q += dq * dt;
    s.th += dth * dt;
    s.x += s.V * Math.cos(s.th) * dt;
    s.z += s.V * Math.sin(s.th) * dt;
    time += dt;
}

function updatePlots() {
    if(!running) return;
    for(let i=0; i<5; i++) physicsStep(); // Over-sampling for stability

    hist.t.push(time);
    hist.z.push(s.z);
    hist.th.push(s.th * 180/Math.PI);
    if(hist.t.length > 500) { hist.t.shift(); hist.z.shift(); hist.th.shift(); }

    Plotly.restyle('statePlot', { x: [hist.t], y: [hist.z] }, [0]);
    
    // Pitch 시각화
    const px = [-1, 1], pz = [-Math.sin(s.th), Math.sin(s.th)];
    Plotly.restyle('vizPlot', { x: [px], y: [pz] }, [0]);

    requestAnimationFrame(updatePlots);
}

function toggleSim() {
    running = !running;
    btn.innerText = running ? "STOP" : "START SIMULATION";
    btn.style.background = running ? "#dc3545" : "#007bff";
    if(running) updatePlots();
}

// Initial Plots
function init() {
    // State Plot
    Plotly.newPlot('statePlot', [{ x:[], y:[], name:'Altitude', line:{color:'#00d4ff'} }], 
        { title:'Live Altitude (m)', paper_bgcolor:'#2d2d2d', plot_bgcolor:'#2d2d2d', 
          font:{color:'#eee'}, margin:{t:40,b:40}});

    // Aero Polar Plot
    let alphas = Array.from({length:50}, (_,i) => -0.2 + i*0.01);
    let polars = alphas.map(a => {
        let res = getAero(a, 0, 0);
        return {cl: res.L/(0.5*1.225*s.V**2*area.value), cd: res.D/(0.5*1.225*s.V**2*area.value)};
    });
    Plotly.newPlot('aeroPolarPlot', [
        { x:alphas.map(a=>a*180/Math.PI), y:polars.map(p=>p.cl), name:'CL' },
        { x:alphas.map(a=>a*180/Math.PI), y:polars.map(p=>p.cd), name:'CD', yaxis:'y2' }
    ], { title:'Aero Derivatives (CL/CD vs Alpha)', paper_bgcolor:'#2d2d2d', plot_bgcolor:'#2d2d2d', 
         font:{color:'#eee'}, yaxis:{title:'CL'}, yaxis2:{overlaying:'y', side:'right', title:'CD'}});

    // Visual
    Plotly.newPlot('vizPlot', [{ x:[-1.2, 1.2], y:[0,0], mode:'lines+markers', line:{width:8, color:'#ffcc00'} }], 
        { title:'Pitch Attitude', paper_bgcolor:'#2d2d2d', plot_bgcolor:'#2d2d2d', font:{color:'#eee'},
          xaxis:{range:[-2,2], fixedrange:true}, yaxis:{range:[-1.5,1.5], fixedrange:true}});
}
init();
</script>
</body>
</html>
