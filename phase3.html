<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 3: Attitude Control</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>고정익 기체 초기 사이징 툴</h1>
    <div class="nav-bar">
        <a href="index.html" class="nav-btn">Home</a>
        <a href="phase1.html" class="nav-btn">1. Initial Sizing</a>
        <a href="phase2.html" class="nav-btn">2. Aero Coeffs</a>
        <a href="phase3.html" class="nav-btn active">3. Attitude Control</a>
        <a href="phase4.html" class="nav-btn">4. Position Control</a>
        <a href="phase5.html" class="nav-btn">5. Multi-Agent</a>
    </div>

    <div class="container">
        <div class="panel">
            <h2>3. Attitude Control (Inner Loop)</h2>
            <div class="action-bar">
                <button class="save-btn" onclick="saveModel()">현재 설정 저장</button>
            </div>
            <div id="savedModelsContainer" class="saved-models"></div>

            <div class="input-group">
                <h3>Roll Controller (PID)</h3>
                <label>P Gain <input type="number" id="att_roll_p" value="1.0" step="0.1"></label>
                <label>I Gain <input type="number" id="att_roll_i" value="0.1" step="0.01"></label>
                <label>D Gain <input type="number" id="att_roll_d" value="0.2" step="0.01"></label>
            </div>
            <div class="input-group">
                <h3>Pitch Controller (PID)</h3>
                <label>P Gain <input type="number" id="att_pitch_p" value="1.5" step="0.1"></label>
                <label>I Gain <input type="number" id="att_pitch_i" value="0.2" step="0.01"></label>
                <label>D Gain <input type="number" id="att_pitch_d" value="0.3" step="0.01"></label>
            </div>
        </div>
        <div class="panel">
            <h2>Response Simulation</h2>
            <div class="note">Step Response Simulation Placeholder</div>
            <canvas id="attCanvas" style="height: 300px;"></canvas>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
